name: Knit R Markdown

on:
  push:
    branches: [main]
    paths:
      - "reaction_time_analysis.Rmd"
      - "Survey.csv"
      - ".github/workflows/knit-rmd.yml"
  workflow_dispatch:

jobs:
  knit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages(c(
            "rmarkdown",
            "tidyverse",
            "corrplot",
            "car",
            "leaps",
            "lmtest",
            "MASS"
          ))

      - name: Knit analysis
        shell: Rscript {0}
        run: |
          rmarkdown::render(
            "reaction_time_analysis.Rmd",
            output_format = "html_document",
            output_file = "reaction_time_analysis.html"
          )

      - name: Upload rendered report
        uses: actions/upload-artifact@v4
        with:
          name: reaction-time-analysis-html
          path: reaction_time_analysis.html
